<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>… Dédicace ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;700&amp;family=Cormorant+Garamond:ital,wght@1,400;1,500&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a0506;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{color:#c9636a}a:hover{color:#e3a2a5}
@keyframes ink{0%{opacity:0;filter:blur(7px);transform:translateY(.28em) rotate(-5deg) scale(1.15)}60%{opacity:1}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes caret{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes rise{0%{transform:translate3d(0,105vh,var(--z));opacity:0}12%{opacity:var(--o)}85%{opacity:var(--o)}100%{transform:translate3d(var(--dx),-8vh,var(--z));opacity:0}}
@keyframes beat{0%,100%{text-shadow:0 0 18px rgba(170,30,40,.55),0 0 60px rgba(120,10,20,.35)}14%{text-shadow:0 0 26px rgba(210,50,60,.8),0 0 90px rgba(150,20,30,.55)}28%{text-shadow:0 0 18px rgba(170,30,40,.55),0 0 60px rgba(120,10,20,.35)}42%{text-shadow:0 0 30px rgba(220,60,70,.85),0 0 110px rgba(160,20,30,.6)}}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
</style>
<script src="lettre-data.js"></script>
</helmet>
<div style="position:fixed;inset:0;overflow:hidden;background:#0a0506;perspective:1000px;perspective-origin:50% 45%;font-family:'Caveat',cursive;color:#efe4dc;user-select:none;-webkit-user-select:none">
  <div ref="{{ sceneRef }}" style="position:absolute;inset:0;transform-style:preserve-3d;will-change:transform">
    <div ref="{{ bgRef }}" style="position:absolute;inset:-12%;background-image:url('assets/fond.jpg');background-size:cover;background-position:50% 30%;filter:blur(5px) brightness(.5) saturate(.85) contrast(1.05);opacity:.34;transform:translateZ(-260px) scale(1.32);transition:opacity 5s ease, filter 5s ease"></div>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%, rgba(90,8,16,.22) 0%, rgba(20,3,6,.55) 55%, rgba(6,2,3,.94) 100%);pointer-events:none"></div>
    <div ref="{{ partRef }}" style="position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none"></div>
    <div ref="{{ stackRef }}" style="position:absolute;left:50%;bottom:38%;width:min(86vw,660px);transform:translateX(-50%);transform-style:preserve-3d;display:flex;flex-direction:column;align-items:center;gap:.45em;text-align:center"></div>
    <div ref="{{ caretRef }}" style="position:absolute;left:50%;top:50%;width:2px;height:34px;margin:-17px 0 0 -1px;background:#b8323c;box-shadow:0 0 12px rgba(200,40,50,.8);opacity:0;transition:opacity 1.5s ease"></div>
  </div>
  <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 18vmax rgba(0,0,0,.85)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;height:1px;background:rgba(120,30,36,.25);pointer-events:none">
    <div ref="{{ progRef }}" style="height:100%;width:0%;background:#9b2630;box-shadow:0 0 8px #9b2630"></div>
  </div>
  <sc-if value="{{ playing }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggleMute }}" aria-label="Son" style="position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(180,60,70,.35);background:rgba(20,5,8,.4);color:#c9636a;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center">{{ muteLabel }}</button>
  </sc-if>
  <sc-if value="{{ showIntro }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:radial-gradient(ellipse at 50% 50%, rgba(40,6,10,.35), rgba(6,2,3,.85));text-align:center">
      <div style="font-family:'Pinyon Script',cursive;font-size:clamp(58px,17vw,128px);line-height:1.1;color:#a3222d;text-shadow:0 0 30px rgba(160,20,30,.55);animation:fadein 3s ease both">… Dédicace ?</div>
      <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(17px,4.4vw,21px);color:#cbb8ae;letter-spacing:.02em;line-height:1.5;animation:fadein 3s ease 1.2s both">Mets tes écouteurs.<br>Et va jusqu'au bout.</div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;animation:fadein 3s ease 2.4s both">
        <button onClick="{{ start }}" style="min-width:170px;min-height:50px;padding:0 30px;border-radius:999px;border:1px solid rgba(190,50,60,.6);background:rgba(110,14,24,.35);color:#f0dcd4;font-family:'Caveat',cursive;font-size:26px;cursor:pointer;box-shadow:0 0 30px rgba(140,20,30,.35)" style-hover="background:rgba(140,20,30,.55)">{{ startLabel }}</button>
        <sc-if value="{{ canRestart }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ restart }}" style="min-height:44px;background:none;border:none;color:#8f7a73;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;cursor:pointer;text-decoration:underline;text-underline-offset:4px">recommencer depuis le début</button>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ ended }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:0;right:0;bottom:max(34px,env(safe-area-inset-bottom));display:flex;justify-content:center;animation:fadein 4s ease 3s both">
      <button onClick="{{ restart }}" style="min-height:44px;padding:0 22px;background:none;border:1px solid rgba(160,40,50,.35);border-radius:999px;color:#9d857d;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:16px;cursor:pointer">relire</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;pace&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:0.3,&quot;min&quot;:0.3,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Rythme (plus haut = plus lent)&quot;},&quot;musicRate&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.7,&quot;max&quot;:1,&quot;step&quot;:0.02,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Rythme (plus haut = plus lent)&quot;},&quot;speed&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1,4,15],&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Aperçu (pour toi, remettre à 1 avant d'envoyer)&quot;}}">
class Component extends DCLogic {
  state = { phase: 'intro', muted: false, saved: 0 };
  sceneRef = React.createRef(); bgRef = React.createRef(); partRef = React.createRef();
  stackRef = React.createRef(); caretRef = React.createRef(); progRef = React.createRef();
  KEY = 'dedicace-pos-v2';

  componentDidMount() {
    this.lines = []; this.clock = 0; this.idx = 0; this.voidMode = false;
    this.px = 0; this.py = 0; this.tx = 0; this.ty = 0;
    this.buildTimeline();
    const saved = parseFloat(localStorage.getItem(this.KEY) || '0') || 0;
    if (saved > 1) this.setState({ saved });
    this.audio = new Audio('assets/musique.mp3'); this.audio.preload = 'auto';
    this.spawnParticles();
    this.onMove = (e) => { this.tx = (e.clientX / innerWidth - .5) * 2; this.ty = (e.clientY / innerHeight - .5) * 2; };
    this.onTilt = (e) => { if (e.gamma == null) return; this.tx = Math.max(-1, Math.min(1, e.gamma / 30)); this.ty = Math.max(-1, Math.min(1, (e.beta - 45) / 30)); };
    this.onVis = () => { if (document.hidden) this.pause(); else if (this.state.phase === 'play') this.resume(); };
    addEventListener('pointermove', this.onMove); addEventListener('deviceorientation', this.onTilt);
    document.addEventListener('visibilitychange', this.onVis);
    this.last = performance.now();
    const loop = (now) => { this.raf = requestAnimationFrame(loop); this.tick(now); };
    this.raf = requestAnimationFrame(loop);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf); this.audio && this.audio.pause();
    removeEventListener('pointermove', this.onMove); removeEventListener('deviceorientation', this.onTilt);
    document.removeEventListener('visibilitychange', this.onVis);
  }
  componentDidUpdate(pp) { if (this.audio) this.audio.playbackRate = this.props.musicRate ?? 0.88; if (pp.pace !== this.props.pace) { this.buildTimeline(); if (this.running) this.seek(this.clock); } }

  buildTimeline() {
    const data = window.LETTRE || [];
    const P = this.props.pace ?? 1;
    const F = { br: 4.5, p: 5.5, void: 12, vp: 7 };
    const n = (e) => e.s.reduce((a, x) => a + x[0].length, 0);
    let t = 0; this.events = [];
    data.forEach((e, i) => {
      let dur, type = 0;
      if (e.k === 'l') {
        const c = n(e);
        if (e.pot) { type = 6; dur = 20; }
        else {
          type = c * 0.1;
          const read = e.hold != null ? e.hold + 0.8 : (2.2 + c * 0.07) * P;
          dur = type + read + (e.st === 'h' ? 4 : 0) + (e.v ? 2 * P : 0);
        }
      } else if (e.k === 'br') dur = e.fast ? 1.6 : Math.max(5, F.br * P);
      else if (e.k === 'p') dur = Math.max(3, F.p * P);
      else if (e.k === 'void') dur = 6;
      else if (e.k === 'vp') dur = Math.max(4, F.vp * P);
      else if (e.k === 'end') dur = 4;
      else dur = 0;
      this.events.push({ t0: t, dur, type, e }); t += dur;
    });
    this.total = t;
  }

  spawnParticles() {
    const root = this.partRef.current; if (!root) return;
    for (let i = 0; i < 26; i++) {
      const d = document.createElement('div'); const sz = 1.5 + Math.random() * 3.5;
      const z = Math.round(-380 + Math.random() * 480);
      d.style.cssText = `position:absolute;top:0;left:${Math.random() * 100}%;width:${sz}px;height:${sz}px;border-radius:50%;background:rgba(${170 + Math.random() * 60|0},${30 + Math.random() * 40|0},40,.9);box-shadow:0 0 ${sz * 3}px rgba(200,40,50,.7);--z:${z}px;--dx:${(Math.random() - .5) * 120}px;--o:${(.25 + Math.random() * .5).toFixed(2)};animation:rise ${16 + Math.random() * 22}s linear ${-Math.random() * 30}s infinite`;
      root.appendChild(d);
    }
  }

  tick(now) {
    const dt = Math.min(0.1, (now - this.last) / 1000); this.last = now;
    this.px += (this.tx - this.px) * 0.04; this.py += (this.ty - this.py) * 0.04;
    const tt = now / 1000, ax = this.px * 3.2 + Math.sin(tt * .13) * 1.2, ay = -this.py * 2.4 + Math.cos(tt * .11) * .9;
    if (this.sceneRef.current) this.sceneRef.current.style.transform = `rotateY(${ax}deg) rotateX(${ay}deg)`;
    const a = this.audio;
    if (a && a.duration && !a.paused) {
      const end = a.duration - 5;
      if (a.currentTime >= end) a.currentTime = 0;
      const edge = Math.min(1, (end - a.currentTime) / 2.5, a.currentTime / 2.5 + 0.05);
      const base = this.state.muted ? 0 : (this.voidMode ? 0.45 : 0.85);
      this.vol = (this.vol ?? 0) + (base * Math.max(0, edge) - (this.vol ?? 0)) * 0.05;
      a.volume = Math.max(0, Math.min(1, this.vol));
    }
    if (!this.running) return;
    this.clock += dt * (this.props.speed ?? 1);
    while (this.idx < this.events.length && this.events[this.idx].t0 <= this.clock) { this.run(this.events[this.idx], false); this.idx++; }
    if (this.progRef.current) this.progRef.current.style.width = Math.min(100, this.clock / this.total * 100) + '%';
    if (now - (this.lastSave || 0) > 2000) { this.lastSave = now; localStorage.setItem(this.KEY, String(Math.min(this.clock, this.total))); }
    if (this.clock >= this.total && this.state.phase !== 'end') { localStorage.setItem(this.KEY, String(this.total)); this.setState({ phase: 'end' }); }
  }

  run(ev, instant) {
    const e = ev.e;
    if (e.k === 'l') { this.caret(false); this.addLine(e, ev.type, instant); }
    else if (e.k === 'br') { this.clearStack(); if (e.endVoid) this.setVoid(false); }
    else if (e.k === 'void') { this.clearStack(); this.setVoid(true); this.caret(true); }
    else if (e.k === 'vp') { this.clearStack(); this.caret(true); }
    else if (e.k === 'end') { this.caret(true, true); }
  }
  caret(on, below) {
    const c = this.caretRef.current; if (!c) return;
    c.style.top = below ? '70%' : '50%';
    c.style.opacity = on ? '1' : '0'; c.style.animation = on ? 'caret 1.1s steps(1) infinite' : 'none';
  }
  setVoid(on) {
    this.voidMode = on; const b = this.bgRef.current; if (!b) return;
    b.style.opacity = on ? '0.1' : '0.34';
    b.style.filter = on ? 'blur(10px) brightness(.3) saturate(.6)' : 'blur(5px) brightness(.5) saturate(.85) contrast(1.05)';
  }

  styleFor(e) {
    if (e.pot) return "font-family:'Pinyon Script',cursive;font-size:clamp(46px,12vw,92px);line-height:1.15;color:#b3262f;";
    if (e.v) return "font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,5.6vw,32px);line-height:1.35;color:#bda69c;";
    if (e.st === 'h') return "font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;font-size:clamp(22px,5.4vw,32px);line-height:1.3;color:#c65a62;letter-spacing:.015em;margin-bottom:.4em;";
    if (e.st === 'b') return "font-size:clamp(32px,8vw,50px);line-height:1.15;font-weight:700;color:#d8747a;text-shadow:0 0 22px rgba(160,20,30,.45);";
    if (e.st === 'i') return "font-size:clamp(28px,7vw,44px);line-height:1.2;color:#d9c3b8;opacity:.92;";
    return "font-size:clamp(28px,7vw,44px);line-height:1.2;font-weight:500;color:#efe4dc;text-shadow:0 2px 14px rgba(0,0,0,.7);";
  }

  addLine(e, typeDur, instant) {
    const stack = this.stackRef.current; if (!stack) return;
    if (e.v) this.clearStack();
    const total = e.s.reduce((a, x) => a + x[0].length, 0) || 1;
    const per = typeDur / total; const cd = Math.max(0.9, Math.min(1.8, per * 14));
    const outer = document.createElement('div');
    outer.style.cssText = 'transform-style:preserve-3d;will-change:transform';
    const inner = document.createElement('div');
    inner.style.cssText = this.styleFor(e) + 'transition:transform 1.6s cubic-bezier(.2,.7,.2,1),opacity 1.6s ease,filter 1.6s ease;transform-origin:50% 100%;text-wrap:balance;';
    let k = 0;
    e.s.forEach(([txt, f]) => {
      const seg = document.createElement('span');
      if (f === 1) seg.style.cssText = 'font-weight:700;color:#d8747a;';
      if (f === 2) seg.style.cssText = 'color:#d9c3b8;';
      txt.split(/(\s+)/).forEach(w => {
        if (!w) return;
        if (/^\s+$/.test(w)) { seg.appendChild(document.createTextNode(' ')); k += w.length; return; }
        const ws = document.createElement('span'); ws.style.cssText = 'display:inline-block;white-space:nowrap';
        for (const ch of w) {
          const c = document.createElement('span'); c.textContent = ch; c.style.display = 'inline-block';
          if (!instant) c.style.animation = `ink ${cd}s cubic-bezier(.2,.6,.2,1) ${(k * per).toFixed(3)}s both`;
          ws.appendChild(c); k++;
        }
        seg.appendChild(ws);
      });
      inner.appendChild(seg);
    });
    if (e.pot && !instant) setTimeout(() => { inner.style.animation = 'beat 2.4s ease-in-out infinite'; }, (typeDur + 1) * 1000 / (this.props.speed ?? 1));
    else if (e.pot) inner.style.animation = 'beat 2.4s ease-in-out infinite';
    outer.appendChild(inner);
    const before = this.lines.map(l => l.outer.getBoundingClientRect().top);
    stack.appendChild(outer);
    this.lines.unshift({ outer, inner });
    if (!instant) this.lines.slice(1).forEach((l, i) => {
      const dy = before[i] - l.outer.getBoundingClientRect().top;
      l.outer.style.transition = 'none'; l.outer.style.transform = `translateY(${dy}px)`;
      l.outer.getBoundingClientRect();
      l.outer.style.transition = 'transform 1.2s cubic-bezier(.2,.7,.2,1)'; l.outer.style.transform = 'none';
    });
    this.applyDepth();
  }
  applyDepth() {
    const op = [1, .5, .28, .14, .06];
    this.lines.forEach((l, d) => {
      if (d >= 5) { l.inner.style.opacity = '0'; const o = l.outer; setTimeout(() => o.remove(), 1700); return; }
      l.inner.style.transform = d ? `translateZ(${-d * 70}px) rotateX(${d * 7}deg) scale(${1 - d * .04})` : 'none';
      l.inner.style.opacity = String(op[d]); l.inner.style.filter = d ? `blur(${d * .7}px)` : 'none';
    });
    this.lines = this.lines.slice(0, 5);
  }
  clearStack() {
    const st = this.stackRef.current;
    if (st) {
      const sb = st.getBoundingClientRect().bottom;
      const offs = this.lines.map(l => sb - l.outer.getBoundingClientRect().bottom);
      this.lines.forEach((l, i) => { l.outer.style.transition = 'none'; l.outer.style.transform = 'none'; l.outer.style.position = 'absolute'; l.outer.style.left = '0'; l.outer.style.right = '0'; l.outer.style.bottom = offs[i] + 'px'; });
    }
    this.lines.forEach(l => {
      l.inner.style.transition = 'transform 2.2s ease, opacity 2s ease, filter 2s ease';
      l.inner.style.transform = 'translateY(-40px) translateZ(-160px)'; l.inner.style.opacity = '0'; l.inner.style.filter = 'blur(5px)';
      const o = l.outer; setTimeout(() => o.remove(), 2300);
    });
    this.lines = [];
  }

  seek(T) {
    if (this.stackRef.current) this.stackRef.current.innerHTML = '';
    this.lines = []; this.setVoid(false); this.caret(false);
    let i = 0; while (i < this.events.length && this.events[i].t0 <= T) i++;
    let from = 0, vm = false;
    for (let j = 0; j < i; j++) { const k = this.events[j].e.k; if (k === 'br' || k === 'void' || k === 'vp') from = j + 1; if (k === 'void') vm = true; if (this.events[j].e.endVoid) vm = false; }
    if (vm) this.setVoid(true);
    for (let j = from; j < i; j++) if (this.events[j].e.k === 'l') this.addLine(this.events[j].e, 0, true);
    this.idx = i; this.clock = T;
  }

  playAudio() {
    const a = this.audio; if (!a) return;
    a.preservesPitch = true; a.playbackRate = this.props.musicRate ?? 0.88;
    const go = () => { a.playbackRate = this.props.musicRate ?? 0.88; if (a.duration) a.currentTime = this.clock % Math.max(1, a.duration - 5); a.play().catch(() => {}); };
    if (a.readyState >= 1) go(); else { a.addEventListener('loadedmetadata', go, { once: true }); a.play().catch(() => {}); }
  }
  pause() { this.running = false; this.audio && this.audio.pause(); document.getAnimations().forEach(x => { if (x.effect && x.effect.getTiming().iterations !== Infinity) x.pause(); }); }
  resume() { this.last = performance.now(); this.running = this.state.phase === 'play'; this.audio && this.audio.play().catch(() => {}); document.getAnimations().forEach(x => x.play()); }

  begin(T) {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {});
    this.seek(T); this.setState({ phase: T >= this.total ? 'end' : 'play' });
    this.last = performance.now(); this.running = T < this.total; this.playAudio();
  }

  renderVals() {
    const { phase, muted, saved } = this.state;
    const resumable = saved > 1 && saved < (this.total || 1e9);
    return {
      showIntro: phase === 'intro',
      playing: phase !== 'intro',
      ended: phase === 'end',
      canRestart: saved > 1,
      startLabel: resumable ? 'Reprendre' : (saved > 1 ? 'Relire la fin' : 'Ouvrir'),
      muteLabel: muted ? 'off' : 'son',
      sceneRef: this.sceneRef, bgRef: this.bgRef, partRef: this.partRef, stackRef: this.stackRef, caretRef: this.caretRef, progRef: this.progRef,
      start: () => this.begin(saved > 1 ? Math.min(saved, (this.total || 0) - 0.01) : 0),
      restart: () => { localStorage.setItem(this.KEY, '0'); this.setState({ saved: 0 }); this.begin(0); },
      toggleMute: () => this.setState(s => ({ muted: !s.muted })),
    };
  }
}
</script>
</body>
</html>
